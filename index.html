<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b2a34">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<title>Mèo diệt gián</title>
<style>
:root{--bg:#1b2a34;--panel:#25394a;--ink:#f6efe0;--cat:#ff9d42;--hp:#ff5d5d;--xp:#5fd1c4;box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px 14px;pointer-events:none}
.bar{height:10px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;margin-bottom:5px}
.bar i{display:block;height:100%;width:100%}
#hp i{background:var(--hp)}#xp i{background:var(--xp);width:0}#bb{display:none;height:12px}#bb i{background:#c8432b}
#row{display:flex;justify-content:space-between;font-size:18px;font-weight:700}
#t{font-size:30px;line-height:1}
#own{display:flex;gap:4px;margin-top:5px;font-size:12px;white-space:nowrap;overflow:hidden}#own i{font-style:normal;background:rgba(0,0,0,.4);border-radius:8px;padding:1px 6px}#own i.g{border:1px solid #ffd24a}
#toast{position:fixed;left:0;right:0;top:calc(96px + env(safe-area-inset-top,0px));text-align:center;font-weight:700;font-size:20px;color:#ffd24a;text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;transition:opacity .3s;padding:0 14px}
.ov{position:fixed;inset:0;display:flex;background:rgba(10,16,20,.9);overflow:auto;touch-action:pan-y;padding:16px;box-sizing:border-box;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.ov.off{display:none}
.ov>.in{margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:420px;text-align:center}
h1{font-size:44px;margin:0;color:var(--cat);line-height:1}
h2{margin:0;font-size:28px}
p{margin:0;max-width:36ch;line-height:1.35}
#emsg,#info{white-space:pre-line}#info{font-size:13px;opacity:.85}
button{font:inherit;color:var(--ink);cursor:pointer}
.go{background:var(--cat);color:#2a1700;border:0;border-radius:14px;padding:10px 28px;font-size:22px;font-weight:700}
.cards{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.card{transition:transform .1s;background:var(--panel);border:2px solid var(--cat);border-radius:14px;padding:10px 14px;text-align:left}
.card:active{transform:scale(.97)}.card b{font-size:20px}.card span{opacity:.8;font-size:15px}
.card:focus-visible,.go:focus-visible,.rr:focus-visible,.chip:focus-visible,.row:focus-visible{outline:3px solid var(--xp);outline-offset:2px}
.rr{background:none;border:2px dashed var(--xp);border-radius:12px;padding:6px 16px}
.rr:disabled{opacity:.4;cursor:default}
.card .h{display:flex;justify-content:space-between;align-items:center;gap:8px}.card small{display:block;color:var(--xp);font-size:14px}.card em{font-style:normal;font-size:13px;white-space:nowrap}
.tl{display:flex;gap:8px;margin-top:6px}.tl button{font-size:13px;background:rgba(0,0,0,.3);border:1px solid #556;border-radius:8px;padding:2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{background:var(--panel);border:2px solid var(--xp);border-radius:12px;padding:3px 10px;font-size:15px}
.chip.on{background:var(--cat);color:#2a1700;border-color:var(--cat)}.chip.lk{opacity:.7;border-style:dashed}
.tabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}.tabs button{background:rgba(0,0,0,.3);border:1px solid #556;border-radius:10px;padding:3px 10px;font-size:14px}.tabs .on{background:var(--xp);color:#10201d}
.panel{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left;max-height:32vh;overflow:auto;touch-action:pan-y}
.row{position:relative;text-align:left;background:var(--panel);border:1px solid var(--xp);border-radius:10px;padding:6px 10px;display:block;width:100%}
.row:disabled{opacity:.5;cursor:default}.row em{position:absolute;right:10px;top:8px;font-style:normal;color:#ffd24a;font-size:14px}.row span{font-size:13px;opacity:.8}.row small{opacity:.7}
.li{padding:5px 9px;background:rgba(0,0,0,.25);border-radius:8px;font-size:14px}.li.ok{border-left:3px solid #ffd24a}
.ab{position:fixed;right:max(16px,env(safe-area-inset-right));width:76px;height:76px;border-radius:50%;border:3px solid var(--cat);background:rgba(37,57,74,.92);font-size:26px;display:none;line-height:1.1}
.ab:disabled{opacity:.7}
#ab{bottom:calc(20px + env(safe-area-inset-bottom,0px))}#ab2{bottom:calc(108px + env(safe-area-inset-bottom,0px))}
#pb{position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(74px + env(safe-area-inset-top,0px));width:42px;height:42px;border-radius:12px;border:2px solid rgba(246,239,224,.4);background:rgba(37,57,74,.8);font-size:18px;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="bar" id="hp"><i></i></div>
  <div class="bar" id="xp"><i></i></div>
  <div class="bar" id="bb"><i></i></div>
  <div id="row"><span id="lv">Cấp 1</span><span id="t">3:00</span><span id="kl">🪳 0</span></div>
  <div id="own"></div>
</div>
<div id="toast"></div>

  <div class="chips" id="catc"></div>
  <div class="chips" id="mapc"></div>

  </div>
  <div class="panel" id="panel"></div>
  <button class="go" id="play">Chơi</button>
  <button class="rr" id="mute">🔊 Âm thanh: bật</button>
</div></div>
<div class="ov off" id="lvl"><div class="in">
  <h2 id="lt">Lên cấp! Chọn 1 thẻ</h2>
  <div class="cards" id="cards"></div>
  <button class="rr" id="rr">Đổi thẻ (1)</button>

<div class="ov off" id="pz"><div class="in">

<div class="ov off" id="end"><div class="in">

  <p id="emsg"></p>
  <button class="go" id="again">Chơi lại</button>
  <button class="rr" id="tomenu">Về menu / cửa hàng</button>
</div></div>
<button id="ab" class="ab"></button>
<button id="ab2" class="ab"></button>
<button id="pb" aria-label="Tạm dừng">⏸</button>

/* ---------- 1. CONFIG ---------- */

 {id:'k',n:'Hạ %t gián trong 1 ván',t:[120,200,300],v:r=>r.kills},

 {id:'c',n:'Mở %t rương',t:[1,2,3],v:r=>r.chest},
 {id:'e',n:'Tiến hóa 1 vũ khí',t:[1,1,1],v:r=>r.evo}
];
const ACH=[
 {id:'w1',n:'Nhà sạch bóng',d:'Thắng 1 ván',f:(m,r)=>m.st.wins>=1},
 {id:'w2',n:'Thợ săn khó tính',d:'Thắng ở độ khó Khó',f:(m,r)=>r.win&&r.diff>=2},
 {id:'w3',n:'Ác mộng của gián',d:'Thắng ở độ khó Ác mộng',f:(m,r)=>r.win&&r.diff>=3},
 {id:'k1',n:'Nghìn gián',d:'Hạ tổng cộng 1000 gián',f:(m,r)=>m.st.kills>=1000},
 {id:'g10',n:'Cày cuốc',d:'Chơi 10 ván',f:(m,r)=>m.st.games>=10},
 {id:'ev',n:'Tiến hóa',d:'Có 1 vũ khí tiến hóa',f:(m,r)=>r.evo>=1},
 {id:'mn',n:'Đầu đàn ngã ngựa',d:'Hạ Gián Đầu Đàn',f:(m,r)=>r.mini>=1},
 {id:'3c',n:'Bộ sưu tập',d:'Mở khóa cả 3 mèo',f:(m,r)=>Object.keys(m.cats).length>=3}
];
const ACM={dash:10,fur:14,box:15};
const DR={mag:'🧲',heal:'🍣',chest:'🎁'};
const RC=['#9aa7b0','#5fb0ff','#ffd24a','#ff5d5d'],RN=['Thường','Hiếm','Huyền thoại','Đánh đổi'];
const ST={
 claw:l=>l?(.9/(1+.18*(l-1))).toFixed(2)+'s, '+(l>=5?3:l>=3?2:1)+' móng':'—',

 broom:l=>l?'hồi '+(1.6/(1+.15*(l-1))).toFixed(2)+'s, tầm '+(70+12*l):'—',

 power:l=>'+'+25*l+'% sát thương',speed:l=>Math.round(170*(1+.15*l))+' tốc độ',

const X={ // id: [icon, tên, độ hiếm, mô tả]

 yarn_a:['🧶','Len khổng lồ',1,'2 cuộn rất to, sát thương ×1.8'],yarn_b:['🧶','Len bầy',1,'Nhiều cuộn nhỏ quay nhanh, sát thương ×0.6'],

 lieu:['🔥','Mèo liều',3,'+50% sát thương, mất 20% máu tối đa'],doi:['🍖','Cơn đói',3,'Gián rơi gấp đôi cá nhưng đông gấp rưỡi'],

/* ---------- 2. LƯU TRỮ ---------- */
let M={c:0,u:{},cats:{cam:1},maps:{bep:1},diff:1,sel:{cat:'cam',map:'bep',diff:1},best:{},ach:{},dly:{d:'',p:{},done:{}},st:{wins:0,kills:0,games:0},mute:0,tab:'shop'};
try{const o=JSON.parse(localStorage.getItem('mdg_meta2'));

function sv(){try{localStorage.setItem('mdg_meta2',JSON.stringify(M))}catch(e){}}
const U=k=>M.u[k]||0;
function todayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function todayMis(){
  const k=todayKey();if(M.dly.d!==k)M.dly={d:k,p:{},done:{}};
  const d=new Date();let x=(d.getFullYear()*372+(d.getMonth()+1)*31+d.getDate())*9301+49297,out=[],used={};
  for(let n=0;n<3;n++){x=(x*9301+49297)%233280;let i=x%MIS.length;while(used[i])i=(i+1)%MIS.length;used[i]=1;out.push({m:MIS[i],t:MIS[i].t[x%3]})}
  return out}

/* ---------- 3. ÂM THANH & RUNG ---------- */
let AC=null;
function au(){if(!AC&&!M.mute){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume()}
function tone(f,d,ty,v,f2){if(!AC||M.mute)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const SN={
 hit:()=>tone(240,.05,'square',.025,120),kill:()=>tone(160,.08,'sawtooth',.03,70),
 hurt:()=>tone(150,.2,'sawtooth',.07,60),meow:()=>tone(420,.3,'triangle',.07,820),
 pick:()=>tone(660,.08,'sine',.05,990),lvl:()=>{tone(523,.1,'triangle',.06);setTimeout(()=>tone(784,.14,'triangle',.06),90)},
 sweep:()=>tone(300,.12,'sawtooth',.03,150),dart:()=>tone(900,.06,'square',.02,500),boom:()=>tone(110,.35,'sawtooth',.08,40),
 boss:()=>{tone(90,.6,'sawtooth',.09,50)},win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.07),i*120))},
 lose:()=>{[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.07),i*160))}
};
const sndT={};
function snd(k){const n=performance.now();if(sndT[k]&&n-sndT[k]<(k=='hit'||k=='kill'?70:30))return;sndT[k]=n;SN[k]()}
function vib(ms){try{if(!M.mute&&navigator.vibrate)navigator.vibrate(ms)}catch(e){}}

/* ---------- 4. TRẠNG THÁI & LOGIC ---------- */
let s,last=0,keys={},ptr=null,EID=0;
const G={run:false};
const F=k=>s.f[k],L=k=>s.up[k]||0;
const PT=Array.from({length:400},()=>({x:0,y:0,vx:0,vy:0,l:0,c:'#fff'}));let pc=0; // pool hạt
function fx(x,y,n,c,v){for(let i=0;i<n;i++){const q=PT[pc=(pc+1)%400],a=Math.random()*6.283,u=v*(.3+Math.random());q.x=x;q.y=y;q.vx=Math.cos(a)*u;q.vy=Math.sin(a)*u;q.l=.3+Math.random()*.3;q.c=c}}
function init(){
  for(const q of PT)q.l=0;
  const c=M.sel.cat,mh=60+10*U('hp')-(c=='den'?10:0);
  s={t:0,x:W/2,y:H/2,hp:mh,max:mh,lv:1,xp:0,need:3,up:{claw:1},f:{},en:[],sh:[],da:[],eb:[],gm:[],dr:[],zn:[],gl:[],dn:[],ac:[],skipT:{},q:0,
     sk:0,face:1,mv:0,ring:null,fur:0,bx:null,lk:null,bn:{},bnN:2+U('ban'),m2:0,ux:1,uy:0,used:0,kills:0,rr:1+U('rr'),pause:true,hold:false,over:false,
     sp:0,cc:0,mc:2,bc:1,gc:2,dc:1,ang:0,inv:0,boss:null,bossIn:false,miniIn:false,mini:0,chest:0,bs:null,warn:null,tt:0,
     sw:[{T:45},{T:105},{T:150}],cat:c,map:M.sel.map,diff:M.sel.diff,crit:CATS[c].crit||0,
     D:DIFF[M.sel.diff],MP:MAPS[M.sel.map],xm:(1+.05*U('xp'))*(c=='tam'?1.25:1)};
}
const PW=()=>(1+.25*L('power'))*(F('lieu')?1.5:1)*(1+.05*U('dmg'));
function msg(t){$('toast').textContent=t;s.tt=2.4}
function num(x,y,v,c){if(s.dn.length<40)s.dn.push({x,y,v:Math.max(1,Math.round(v)),l:.7,c})}
function gem(x,y,v){if(s.gm.length>140){const g=s.gm[Math.random()*s.gm.length|0];g.v=(g.v||1)+v}else s.gm.push({x,y,v})}
function drop(k,x,y){s.dr.push({x,y,k,l:k=='chest'?40:14})}
function ptype(){const r=Math.random(),t=s.t;
  if(t>s.MP.tank&&r<.12)return'tank';if(t>100&&r<.22)return'bomb';if(t>s.MP.spi&&r<.34)return'spid';if(t>45&&r<.5)return'fly';if(t>60&&r<.7)return'fast';return'norm'}
function mk(k,role,x,y){
  if(x==null){const e=Math.random()*4|0;x=e<2?Math.random()*W:(e==2?-30:W+30);y=e>=2?Math.random()*H:(e==0?-30:H+30)}
  const T=TY[k],m=(1+s.t/120)*s.D.hp,o={x,y,k,hp:T.hp*m,sp:T.sp*s.MP.sp,r:T.r,sz:T.sz,dmg:Math.round(T.dmg*s.D.dm),g:T.g,f:0,yt:0,ph:Math.random()*6.283,cd:1+Math.random()*2,c:T.c,fz:0,st:0,id:++EID};
  if(role=='boss'){Object.assign(o,{k:'boss',hp:1100*s.D.hp,sp:55,r:34,sz:84,dmg:Math.round(12*s.D.dm),g:0,role:'boss',dc:3,dash:0,sm:5,pz:3,ph:1,c:['#5a2a12','#7a3d1a']});o.max=o.hp;s.boss=o}
  else if(role=='mini'){Object.assign(o,{k:'mini',hp:260*s.D.hp,sp:62,r:26,sz:60,dmg:Math.round(9*s.D.dm),g:6,role:'mini',dc:3,dash:0,c:['#6b2f2f','#8d4545']});o.max=o.hp}
  s.en.push(o)}
function hurt(d){s.hp-=d;s.inv=.6;s.sk=.25;fx(s.x,s.y,7,'#ff5d5d',100);snd('hurt');vib(30)}
function hit(e,d,q){
  if(e.dead)return;
  let c=0;if(!q){const cr=s.crit+(F('evo_ninja')?.1:0);if(cr>0&&Math.random()<cr){d*=2;c=1}}
  e.hp-=d;e.f=.08;
  if(!q){fx(e.x,e.y,3,'#f6efe0',70);num(e.x,e.y-e.sz/2,d,c);snd('hit')}
  if(e.hp<=0)kill(e)}
function kill(e){
  e.dead=true;s.kills++;fx(e.x,e.y,e.role=='boss'?30:9,'#9aa83a',130);snd('kill');
  const gch=(F('luck')?.1:0)+.02*U('gold')+(s.cat=='tam'?.05:0);
  for(let i=0;i<e.g*(F('doi')?2:1);i++)gem(e.x+(Math.random()-.5)*14,e.y+(Math.random()-.5)*14,Math.random()<gch?5:1);
  if(e.role=='boss'){finish(true);return}
  if(e.role=='mini'){s.mini++;drop('chest',e.x,e.y);msg('Hạ Gián Đầu Đàn! Nhặt rương 🎁');return}
  const r=Math.random();
  if(e.k=='tank'&&r<.04)drop('chest',e.x,e.y);else if(r<.012)drop('mag',e.x,e.y);else if(r<.03)drop('heal',e.x,e.y)}
function boom(e){fx(e.x,e.y,24,'#ff7a2a',220);snd('boom');if(Math.hypot(s.x-e.x,s.y-e.y)<80&&s.inv<=0)hurt(14*s.D.dm);e.dead=true}

// chia ô lưới để gián đẩy nhau (tránh dồn thành một cục)
const CS=40;let gC=0,gR=0;const gD=[];
function sep(){
  gC=Math.ceil(W/CS)+2;gR=Math.ceil(H/CS)+2;const n=gC*gR;
  while(gD.length<n)gD.push([]);for(let i=0;i<n;i++)gD[i].length=0;
  for(const e of s.en){const cx=cl(((e.x/CS)|0)+1,0,gC-1),cy=cl(((e.y/CS)|0)+1,0,gR-1);e.ci=cy*gC+cx;gD[e.ci].push(e)}
  for(const e of s.en){const cx=e.ci%gC,cy=(e.ci/gC)|0;
    for(let j=cy-1;j<=cy+1;j++)for(let i=cx-1;i<=cx+1;i++){if(i<0||j<0||i>=gC||j>=gR)continue;
      for(const o of gD[j*gC+i]){if(o.id<=e.id)continue;
        const dx=e.x-o.x,dy=e.y-o.y,md=(e.r+o.r)*.8,q=dx*dx+dy*dy;if(q>=md*md||q==0)continue;
        const d=Math.sqrt(q),p=(md-d)*.4,nx=dx/d,ny=dy/d,er=!!e.role,or=!!o.role;
        if(!er){e.x+=nx*p*(or?2:1);e.y+=ny*p*(or?2:1)}
        if(!or){o.x-=nx*p*(er?2:1);o.y-=ny*p*(er?2:1)}}}}}

function step(dt){
  let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(ptr){dx=(ptr.x-ptr.ox)/45;dy=(ptr.y-ptr.oy)/45}
  const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}
  const sp=170*(1+.15*L('speed'))*(1+.03*U('spd'))*(s.cat=='tam'?.95:1)*(F('evo_ninja')?1.15:1);
  s.x=cl(s.x+dx*sp*dt,16,W-16);s.y=cl(s.y+dy*sp*dt,60,H-16);
  s.t+=dt;s.inv-=dt;s.ang+=3*dt;if(dx)s.face=dx>0?1:-1;if(m>.1)s.mv+=dt*14;s.sk=Math.max(0,s.sk-dt);s.tt-=dt;
  for(const q of PT)if(q.l>0){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.92;q.vy*=.92;q.l-=dt}
  for(const n of s.dn){n.y-=28*dt;n.l-=dt}s.dn=s.dn.filter(n=>n.l>0);
  if(L('heal'))s.hp=Math.min(s.max,s.hp+.6*L('heal')*dt);
  // --- sinh gián
  if(s.t<DUR){s.sp+=dt*(1.2+s.t/40)*(F('doi')?1.5:1)*s.D.sp;while(s.sp>=1){s.sp--;if(s.en.length<CAP)mk(ptype())}}
  else if(!s.bossIn){s.bossIn=true;mk('norm','boss');msg('Gián Chúa xuất hiện!');snd('boss')}
  if(s.t>=MINI_T&&!s.miniIn&&s.t<DUR){s.miniIn=true;mk('norm','mini');msg('⭐ Gián Đầu Đàn xuất hiện!');snd('boss')}
  for(const ev of s.sw){
    if(!ev.w&&s.t>=ev.T-2){ev.w=1;ev.side=Math.random()*4|0;s.warn=ev;msg('⚠️ Bầy gián tràn tới!')}
    if(!ev.done&&s.t>=ev.T){ev.done=1;if(s.warn===ev)s.warn=null;const n=10+(ev.T/12|0);
      for(let i=0;i<n;i++){const f=(i+.5)/n,sd=ev.side,x=sd==2?-24:sd==3?W+24:W*f,y=sd==0?-24:sd==1?H+24:H*f;mk('sw',null,x,y)}}}
  const pw=PW();
  // --- kỹ năng chủ động
  for(const a of s.ac)a.cd-=dt;
  s.fur-=dt;if(m>.1){s.ux=dx/m;s.uy=dy/m}
  if(s.bx){s.bx.t-=dt;if(s.bx.t<=0){for(const e of s.en)if(Math.hypot(e.x-s.bx.x,e.y-s.bx.y)<140)hit(e,60*pw);fx(s.bx.x,s.bx.y,25,'#5fd1c4',200);s.bx=null;s.sk=.3;snd('boom')}}
  // --- gián
  sep();
  for(const e of s.en){
    if(e.dead)continue;
    e.f-=dt;
    const ax=s.x-e.x,ay=s.y-e.y,d=Math.hypot(ax,ay)||1;
    if(s.fur>0&&d<e.r+22){hit(e,40*dt,1);if(e.dead)continue}
    let slow=1;
    for(const g of s.gl)if(Math.hypot(e.x-g.x,e.y-g.y)<g.r+e.r*.5){slow=e.role?.7:.35;hit(e,5*pw*dt,1);break}
    if(e.dead)continue;
    if(e.st>0){e.st-=dt;continue}
    let v=e.sp*slow,mx=ax/d,my=ay/d;
    if(e.role){
      e.dc-=dt;if(e.dash>0){e.dash-=dt;v=330*slow}else if(e.dc<=0){e.dc=e.role=='mini'?5:(e.ph==3?3:4);e.dash=.7}
      if(e.role=='boss'){
        const r=e.hp/e.max,ph=r>.66?1:r>.33?2:3;
        if(ph!=e.ph){e.ph=ph;msg(ph==2?'😡 Gián Chúa triệu hồi đàn con!':'☠️ Gián Chúa phun độc!');fx(e.x,e.y,30,'#ff5d5d',220);s.sk=.4;snd('boss')}
        if(ph>=2){e.sm-=dt;if(e.sm<=0){e.sm=6;for(let i=0;i<5;i++)if(s.en.length<CAP+20)mk('norm',null,e.x+(Math.random()-.5)*90,e.y+(Math.random()-.5)*90)}}
        if(ph>=3){e.pz-=dt;if(e.pz<=0){e.pz=2.6;s.zn.push({x:cl(s.x+(Math.random()-.5)*140,40,W-40),y:cl(s.y+(Math.random()-.5)*140,80,H-40),r:56,w:1,t:4.5})}}
      }
    }else if(e.k=='fly'){const w=Math.sin(s.t*4+e.ph)*.9,tx=mx-my*w,ty=my+mx*w,n=Math.hypot(tx,ty)||1;mx=tx/n;my=ty/n}
    else if(e.k=='spid'){
      if(d<190){mx=-mx;my=-my;v*=.7}else if(d<=260){const t=mx;mx=-my*.8;my=t*.8}
      e.cd-=dt;if(e.cd<=0&&d<460){e.cd=2.4;s.eb.push({x:e.x,y:e.y,vx:ax/d*180,vy:ay/d*180,l:3.5})}}
    else if(e.k=='bomb'){if(e.fz>0){e.fz-=dt;v*=.2;if(e.fz<=0){boom(e);continue}}else if(d<70)e.fz=.7}
    e.x+=mx*v*dt;e.y+=my*v*dt;
    if(s.bx&&!e.role){const bx=s.bx.x-e.x,by=s.bx.y-e.y,bd=Math.hypot(bx,by)||1;if(bd<300){e.x+=bx/bd*130*dt;e.y+=by/bd*130*dt}}
    if(e.dmg>0&&d<e.r+12&&s.inv<=0)hurt(e.dmg);
  }
  // đạn của nhện
  for(const b of s.eb){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(s.inv<=0&&Math.hypot(b.x-s.x,b.y-s.y)<14){hurt(6*s.D.dm);b.l=0}}
  s.eb=s.eb.filter(b=>b.l>0);
  // vũng độc của Gián Chúa
  for(const z of s.zn){z.t-=dt;if(z.w>0){z.w-=dt;continue}
    if(s.inv<=0&&Math.hypot(s.x-z.x,s.y-z.y)<z.r){s.hp-=10*s.D.dm*dt;if(Math.random()<.1)fx(s.x,s.y,2,'#9ad43a',60)}}
  s.zn=s.zn.filter(z=>z.t>0);
  // --- vũ khí: móng vuốt
  if(L('claw')){const l=L('claw');s.cc-=dt;
    if(s.cc<=0&&s.en.length){s.cc=.9/(1+.18*(l-1))*(F('evo_ninja')?.75:1);let n=null,bd=1e9;for(const e of s.en){const d=d2(e,s);if(d<bd){bd=d;n=e}}
      const a=Math.atan2(n.y-s.y,n.x-s.x),c=F('claw_b')?5:l>=5?3:l>=3?2:1;
      for(let i=0;i<c;i++){const b=a+(i-(c-1)/2)*(c==5?.3:.22);s.sh.push({x:s.x,y:s.y,vx:Math.cos(b)*440,vy:Math.sin(b)*440,l:1.2,p:F('claw_a')?3:l>=4?1:0,d:10*pw*(F('claw_b')?.6:1),h:new Set()})}}}
  for(const b of s.sh){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
    for(const e of s.en){if(e.dead||b.h.has(e)||Math.hypot(e.x-b.x,e.y-b.y)>e.r+6)continue;b.h.add(e);hit(e,b.d);
      if(F('evo_claw'))for(const o of s.en)if(o!==e&&!o.dead&&Math.hypot(o.x-e.x,o.y-e.y)<45)hit(o,b.d*.5);
      if(b.p-->0)continue;b.l=0;break}}
  s.sh=s.sh.filter(b=>b.l>0);
  // cuộn len
  for(const b of yballs())for(const e of s.en)if(!e.dead&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.rad&&s.t-e.yt>.4){e.yt=s.t;hit(e,(F('yarn_a')?14.4:F('yarn_b')?4.8:8)*(F('lenlua')?1.5:1)*pw)}
  // meow
  if(L('meow')){s.mc-=dt;if(s.mc<=0){s.mc=(5-.5*L('meow'))*(F('meow_b')?.6:1);fire();if(F('meow_b'))s.m2=.3}
    if(s.m2>0){s.m2-=dt;if(s.m2<=0)fire()}}
  if(s.ring){s.ring.r+=320*dt;
    for(const e of s.en){if(e.dead||s.ring.h.has(e)||Math.hypot(e.x-s.x,e.y-s.y)>s.ring.r)continue;s.ring.h.add(e);hit(e,14*pw*(F('evo_meow')?2:1));if(F('meow_a'))e.st=e.role?.25:1;if(!e.role){const d=Math.hypot(e.x-s.x,e.y-s.y)||1;e.x+=(e.x-s.x)/d*30;e.y+=(e.y-s.y)/d*30}}
    if(s.ring.r>=s.ring.max)s.ring=null}
  // chổi thần
  if(L('broom')){s.bc-=dt;if(s.bc<=0&&s.en.length){const l=L('broom');s.bc=1.6/(1+.15*(l-1));
    let a=Math.atan2(s.uy,s.ux),n=null,bd=220*220;for(const e of s.en){const d=d2(e,s);if(d<bd){bd=d;n=e}}if(n)a=Math.atan2(n.y-s.y,n.x-s.x);
    const R=70+12*l,full=!!F('evo_broom'),half=1.1,dm=14*pw*(full?1.4:1);
    for(const e of s.en){if(e.dead)continue;const ex=e.x-s.x,ey=e.y-s.y,dd=Math.hypot(ex,ey);if(dd>R+e.r)continue;
      if(!full){let da=Math.atan2(ey,ex)-a;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)>half)continue}
      hit(e,dm);if(!e.role&&dd>0&&!e.dead){e.x+=ex/dd*35;e.y+=ey/dd*35}}
    s.bs={a,R,t:.25,full};snd('sweep')}}
  if(s.bs){s.bs.t-=dt;if(s.bs.t<=0)s.bs=null}
  // bẫy keo
  if(L('glue')){const l=L('glue');s.gc-=dt;if(s.gc<=0&&s.gl.length<l+1){s.gc=3.5/(1+.1*(l-1));s.gl.push({x:s.x,y:s.y,r:34+3*l,t:8})}}
  for(const g of s.gl)g.t-=dt;s.gl=s.gl.filter(g=>g.t>0);
  // cá phi tiêu
  if(L('dart')){const l=L('dart');s.dc-=dt;if(s.dc<=0&&s.en.length){s.dc=1.7/(1+.1*(l-1));const n=l>=5?3:l>=3?2:1;
    for(let i=0;i<n;i++){const a=Math.random()*6.283;s.da.push({x:s.x,y:s.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,tg:s.en[Math.random()*s.en.length|0],l:2.5,d:9*pw})}snd('dart')}}
  for(const b of s.da){
    if(!b.tg||b.tg.dead){let n=null,bd=1e9;for(const e of s.en){if(e.dead)continue;const d=d2(e,b);if(d<bd){bd=d;n=e}}b.tg=n}
    if(b.tg){const a=Math.atan2(b.tg.y-b.y,b.tg.x-b.x),c=Math.atan2(b.vy,b.vx);let da=a-c;da=Math.atan2(Math.sin(da),Math.cos(da));const na=c+cl(da,-6*dt,6*dt);b.vx=Math.cos(na)*330;b.vy=Math.sin(na)*330}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
    for(const e of s.en){if(e.dead)continue;if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+6){hit(e,b.d);b.l=0;break}}}
  s.da=s.da.filter(b=>b.l>0);
  s.en=s.en.filter(e=>!e.dead);
  // --- vật phẩm rơi
  for(const p of s.dr){p.l-=dt;if(Math.hypot(s.x-p.x,s.y-p.y)<26){p.l=0;
    if(p.k=='mag'){s.gm.forEach(g=>g.pull=1);msg('🧲 Hút hết cá!');snd('pick')}
    else if(p.k=='heal'){s.hp=Math.min(s.max,s.hp+20);msg('🍣 Hồi máu!');snd('pick')}
    else{s.chest++;s.q++;snd('lvl')}}}
  s.dr=s.dr.filter(p=>p.l>0);
  // --- cá (xp)
  const mag=(50+35*L('magnet'))*(F('thinh')?1.4:1);
  for(const g of s.gm){const d=Math.hypot(s.x-g.x,s.y-g.y)||1;
    if(d<mag||g.pull){g.x+=(s.x-g.x)/d*280*dt;g.y+=(s.y-g.y)/d*280*dt}
    if(d<14){g.t=1;s.xp+=(g.v||1)*s.xm}}
  s.gm=s.gm.filter(g=>!g.t);
  while(s.xp>=s.need){s.xp-=s.need;s.lv++;s.need=Math.round(s.need*1.2+1);s.q++;snd('lvl');vib(15)}

}

  ctx.globalAlpha=1;
  ctx.restore();
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.hypot(W,H)*.6);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  if(ptr&&G.run&&!s.pause&&!s.hold){const ex=ptr.x-ptr.ox,ey=ptr.y-ptr.oy,dd=Math.hypot(ex,ey),k=dd>45?45/dd:1;
    ctx.globalAlpha=.35;ctx.strokeStyle='#f6efe0';ctx.lineWidth=3;ctx.beginPath();ctx.arc(ptr.ox,ptr.oy,45,0,6.283);ctx.stroke();ctx.fillStyle='#f6efe0';circ(ptr.ox+ex*k,ptr.oy+ey*k,18);ctx.globalAlpha=1}
  $('hp').firstElementChild.style.width=cl(s.hp/s.max*100,0,100)+'%';
  $('xp').firstElementChild.style.width=cl(s.xp/s.need*100,0,100)+'%';
  const bb=$('bb');if(s.boss&&!s.boss.dead&&!s.over){bb.style.display='block';bb.firstElementChild.style.width=cl(s.boss.hp/s.boss.max*100,0,100)+'%'}else bb.style.display='none';
  $('lv').textContent='Cấp '+s.lv;$('kl').textContent='🪳 '+s.kills;
  for(let i=0;i<2;i++){const b=$(i?'ab2':'ab'),a=s.ac[i];
    if(!a||!G.run){b.style.display='none';continue}
    b.style.display='block';const mx=ACM[a.id],p=a.cd>0?1-a.cd/mx:1;
    b.style.background='conic-gradient(var(--cat) '+(p*360)+'deg,rgba(37,57,74,.92) 0)';b.disabled=a.cd>0;b.textContent=X[a.id][0]+(a.cd>0?' '+Math.ceil(a.cd):'')}
  $('toast').style.opacity=s.tt>0?1:0;
  $('t').textContent=s.bossIn&&s.boss&&!s.over?'Gián Chúa':fmt(DUR-s.t);
}
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(!s.pause&&!s.over&&!s.hold&&G.run)step(dt);
  draw();requestAnimationFrame(loop);
}

/* ---------- 7. MENU / META ---------- */
function mutebtn(){const t=M.mute?'🔇 Âm thanh: tắt':'🔊 Âm thanh: bật';$('mute').textContent=t;$('mute2').textContent=t}
function toggleMute(){M.mute=M.mute?0:1;if(!M.mute)au();sv();mutebtn()}
function chipRow(id,list,cur,isOpen,costOf,choose){
  const b=$(id);b.innerHTML='';
  for(const k in list){const o=list[k],op=isOpen(k),c=document.createElement('button');c.className='chip'+(String(cur)==k?' on':'')+(op?'':' lk');
    c.textContent=(op?'':'🔒 ')+o.e+' '+o.n+(op&&String(cur)!=k||op?'':costOf(k));
    c.onclick=()=>choose(k,op);b.appendChild(c)}}
function menu(){
  const sel=M.sel;
  $('coin').textContent='🐟 Xu cá: '+M.c;
  chipRow('catc',CATS,sel.cat,k=>M.cats[k],k=>' · '+CATS[k].cost+' xu',(k,op)=>{if(!op){if(M.c<CATS[k].cost)return;M.c-=CATS[k].cost;M.cats[k]=1}sel.cat=k;sv();menu()});
  chipRow('mapc',MAPS,sel.map,k=>M.maps[k],k=>' · '+MAPS[k].cost+' xu',(k,op)=>{if(!op){if(M.c<MAPS[k].cost)return;M.c-=MAPS[k].cost;M.maps[k]=1}sel.map=k;sv();menu()});
  chipRow('difc',DIFF,sel.diff,k=>+k<=M.diff,k=>' · thắng độ khó trước',(k,op)=>{if(op){sel.diff=+k;sv();menu()}});
  $('info').textContent=CATS[sel.cat].d+'\n'+MAPS[sel.map].d+'\n'+DIFF[sel.diff].d;
  for(const b of $('tabs').children)b.className=b.dataset.t==M.tab?'on':'';
  panel();mutebtn()}
function panel(){
  const p=$('panel');p.innerHTML='';
  if(M.tab=='shop'){
    for(const k in UPG){const u=UPG[k],l=U(k),cost=u.cost(l),b=document.createElement('button');b.className='row';b.disabled=l>=u.max||M.c<cost;
      b.innerHTML='<b>'+u.n+'</b> <small>'+l+'/'+u.max+'</small><br><span>'+u.d+'</span><em>'+(l>=u.max?'Tối đa':cost+' xu')+'</em>';
      b.onclick=()=>{if(M.c>=cost&&l<u.max){M.c-=cost;M.u[k]=l+1;sv();menu()}};p.appendChild(b)}}
  else if(M.tab=='mis'){
    for(const x of todayMis()){const d=document.createElement('div'),dn=M.dly.done[x.m.id],pr=Math.min(M.dly.p[x.m.id]||0,x.t);
      d.className='li'+(dn?' ok':'');d.textContent=(dn?'✅ ':'⬜ ')+x.m.n.replace('%t',x.t)+' ('+pr+'/'+x.t+') · +25 xu';p.appendChild(d)}
    const n=document.createElement('div');n.className='li';n.textContent='Nhiệm vụ đổi mỗi ngày. Tổng: '+M.st.games+' ván, '+M.st.wins+' thắng, '+M.st.kills+' gián.';p.appendChild(n)}
  else if(M.tab=='ach'){
    for(const a of ACH){const d=document.createElement('div');d.className='li'+(M.ach[a.id]?' ok':'');d.textContent=(M.ach[a.id]?'🏆 ':'🔘 ')+a.n+' — '+a.d+' · +30 xu';p.appendChild(d)}}
  else{
    const ks=Object.keys(M.best);if(!ks.length){const d=document.createElement('div');d.className='li';d.textContent='Chưa có kỷ lục. Chơi một ván đi!';p.appendChild(d)}
    for(const k of ks){const [c,m]=k.split('|'),b=M.best[k],d=document.createElement('div');d.className='li';
      d.textContent=(CATS[c]?CATS[c].e+' '+CATS[c].n:c)+' · '+(MAPS[m]?MAPS[m].e+' '+MAPS[m].n:m)+': sống '+fmt(b.t)+', '+b.k+' gián'+(b.w?', thắng nhanh nhất '+fmt(b.w):'');p.appendChild(d)}}}
for(const b of $('tabs').children)b.onclick=()=>{M.tab=b.dataset.t;sv();menu()};

/* ---------- 8. NHẬP LIỆU ---------- */
$('play').onclick=start;
$('again').onclick=start;
$('tomenu').onclick=()=>{$('end').classList.add('off');init();menu();$('start').classList.remove('off')};
$('ab').onclick=()=>use(0);$('ab2').onclick=()=>use(1);
$('pb').onclick=pauseGame;$('resume').onclick=resumeGame;
$('quit').onclick=()=>{s.over=true;G.run=false;$('pz').classList.add('off');$('pb').style.display='none';$('ab').style.display=$('ab2').style.display='none';init();menu();$('start').classList.remove('off')};
$('mute').onclick=toggleMute;$('mute2').onclick=toggleMute;
addEventListener('pointerdown',()=>au(),{passive:true});
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys[k]=1;
  if(k==' '||k=='e'){e.preventDefault();use(0)}
  else if(k=='q')use(1);
  else if(k=='p'||k=='escape'){if(s.hold)resumeGame();else pauseGame()}
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
cv.addEventListener('pointerdown',e=>{if(ptr)return;ptr={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY}});
addEventListener('pointermove',e=>{if(ptr&&e.pointerId===ptr.id){ptr.x=e.clientX;ptr.y=e.clientY}});
const rel=e=>{if(ptr&&e.pointerId===ptr.id)ptr=null};
addEventListener('pointerup',rel);addEventListener('pointercancel',rel);
document.addEventListener('visibilitychange',()=>{if(document.hidden){keys={};ptr=null;pauseGame()}});
addEventListener('blur',()=>{keys={};ptr=null;pauseGame()});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

init();menu();own();requestAnimationFrame(loop);
</script>
</body>
